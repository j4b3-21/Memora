spring:
  application:
    name: backend
  datasource:
    url: jdbc:sqlite:./data/memora.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mainboard:
  upload:
    directory: ./data/uploads
    max-file-size: 10485760